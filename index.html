<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Treino</title>
    <meta name="mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --primary: #38bdf8;
            --accent: #f472b6; --text-main: #f8fafc; --text-dim: #94a3b8;
            --success: #4ade80; --border: #334155; --danger: #ef4444;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 120px; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; padding: 20px 0; text-align: center; background: #1e293b; border-bottom: 1px solid var(--border); position: relative; }
        header h1 { margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }
        .settings-btn { position: absolute; right: 20px; top: 18px; font-size: 1.2rem; cursor: pointer; filter: grayscale(1); }

        .tabs-container { position: sticky; top: 0; width: 100%; max-width: 500px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; z-index: 1000; border-bottom: 1px solid var(--border); }
        .tab-btn { background: none; border: none; color: var(--text-dim); font-weight: 700; font-size: 1.1rem; padding: 15px; flex: 1; outline: none; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        .container { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; }
        .workout-content { display: none; }
        .workout-content.active { display: block; }

        h2 { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; margin: 10px 0 20px 0; display: flex; align-items: center; gap: 10px; }
        h2::before { content: ''; width: 4px; height: 16px; background: var(--accent); border-radius: 4px; }

        .exercise-card { background: var(--card-bg); border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; position: relative; transition: 0.3s; }
        .exercise-card.completed { opacity: 0.3; filter: grayscale(1); }

        .btn-remove { display: none; position: absolute; right: -8px; top: -8px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: bold; cursor: pointer; z-index: 10; }
        .edit-mode .btn-remove { display: block; }

        .custom-checkbox { min-width: 26px; height: 26px; position: relative; cursor: pointer; margin-top: 2px; }
        .custom-checkbox input { opacity: 0; width: 0; height: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 26px; width: 26px; border: 2px solid var(--border); border-radius: 50%; transition: 0.3s; }
        .custom-checkbox input:checked ~ .checkmark { background: var(--success); border-color: var(--success); }
        .checkmark:after { content: ""; position: absolute; display: none; left: 8px; top: 4px; width: 6px; height: 11px; border: solid white; border-width: 0 3px 3px 0; transform: rotate(45deg); }
        .custom-checkbox input:checked ~ .checkmark:after { display: block; }

        .ex-data { flex-grow: 1; }
        .ex-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .ex-name { font-weight: 600; font-size: 1rem; color: var(--text-main); text-decoration: none; padding-right: 5px; }
        
        .tag { font-size: 0.6rem; background: rgba(56, 189, 248, 0.1); color: var(--primary); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--primary); text-transform: uppercase; font-weight: 800; white-space: nowrap; }

        .ex-info { display: flex; gap: 12px; flex-wrap: wrap; }
        .info-label { font-size: 0.55rem; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 2px; }
        .info-value { font-size: 0.85rem; font-weight: 700; color: #fff; }
        
        .timer-trigger { color: var(--accent); border-bottom: 1px dotted var(--accent); cursor: pointer; }
        .weight-input { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 6px; color: var(--success); padding: 4px 8px; width: 65px; font-weight: 800; outline: none; }

        .btn-add { display: none; width: 100%; padding: 15px; background: transparent; border: 2px dashed var(--border); color: var(--text-dim); border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .edit-mode .btn-add { display: block; }

        #timer-widget { position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px; background: var(--accent); border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; color: white; z-index: 2000; box-shadow: 0 5px 15px rgba(244,114,182,0.4); }
    </style>
</head>
<body onload="init()">

<header>
    <h1>Treino</h1>
    <div class="settings-btn" onclick="toggleEditMode()">⚙️</div>
</header>

<div class="tabs-container" id="tabs">
    <button class="tab-btn active" onclick="showWorkout('treinoA', this)">A</button>
    <button class="tab-btn" onclick="showWorkout('treinoB', this)">B</button>
    <button class="tab-btn" onclick="showWorkout('treinoC', this)">C</button>
    <button class="tab-btn" onclick="showWorkout('treinoD', this)">D</button>
    <button class="tab-btn" onclick="showWorkout('treinoE', this)">E</button>
</div>

<div id="timer-widget" onclick="stopTimer()">00</div>

<div class="container" id="main-container"></div>

<script>
    const defaultWorkouts = {
        treinoA: { title: "Treino A - Peito", exercises: [
            {id: 'a1', name: "Supino inclinado halteres", reps: "2x12 + 2x8", time: "1m30", tag: "Pesado"},
            {id: 'a2', name: "Supino reto barra", reps: "4x12", time: "1m30", tag: ""},
            {id: 'a3', name: "Voador", reps: "3x12 (2s iso)", time: "1m30", tag: ""},
            {id: 'a4', name: "Crossover baixo", reps: "3x12", time: "1m30", tag: ""},
            {id: 'a5', name: "Paralelas", reps: "3x máx", time: "1m30", tag: ""},
            {id: 'a6', name: "Elevação lateral sentado", reps: "3x12 + 1", time: "1m30", tag: "Drop"},
            {id: 'a7', name: "Tríceps testa halter", reps: "3x12", time: "1m30", tag: ""},
            {id: 'a8', name: "Tríceps corda", reps: "2x12 + 1x10", time: "1m30", tag: "Drop"}
        ]},
        treinoB: { title: "Treino B - Costas", exercises: [
            {id: 'b1', name: "Barra fixa pronada", reps: "40 reps", time: "1m30", tag: ""},
            {id: 'b2', name: "Remada curvada", reps: "2x12 + 2x8", time: "Nec.", tag: "Pesado"},
            {id: 'b3', name: "Puxador triângulo", reps: "3x15", time: "1m", tag: ""},
            {id: 'b4', name: "Pulldown", reps: "4x12", time: "1m30", tag: ""},
            {id: 'b5', name: "Remada baixa aberta", reps: "3x10 + 1", time: "1m30", tag: "Drop"},
            {id: 'b6', name: "Rosca alternada", reps: "3x12", time: "1m", tag: ""},
            {id: 'b7', name: "Rosca Scott máquina", reps: "3x12", time: "1m30", tag: ""},
            {id: 'b8', name: "Encolhimento ombros", reps: "3x15", time: "Nec.", tag: ""}
        ]},
        treinoC: { title: "Treino C - Anterior", exercises: [
            {id: 'c1', name: "Cadeira adutora", reps: "3x15", time: "1m30", tag: ""},
            {id: 'c2', name: "Agachamento hack", reps: "3x10-12", time: "1m30", tag: ""},
            {id: 'c3', name: "Leg 45°", reps: "2x12+2x8", time: "Nec.", tag: ""},
            {id: 'c4', name: "Cadeira extensora", reps: "3x15 + drop", time: "1m30", tag: "Drop"},
            {id: 'c5', name: "Stiff", reps: "4x12", time: "1m30", tag: ""},
            {id: 'c6', name: "Panturrilha em pé", reps: "3x falha", time: "1m30", tag: ""},
            {id: 'c7', name: "Panturrilha sentada", reps: "3x falha", time: "1m30", tag: ""}
        ]},
        treinoD: { title: "Treino D - Ombro", exercises: [
            {id: 'd1', name: "Desenvolvimento halteres", reps: "2x12 + 2x6-8", time: "1m30", tag: "Pesado"},
            {id: 'd2', name: "Elevação lateral halter", reps: "3x15 + drop", time: "Nec.", tag: "Drop"},
            {id: 'd3', name: "Elevação lateral máquina", reps: "3x12", time: "1m30", tag: ""},
            {id: 'd4', name: "Crucifixo inverso", reps: "3x15", time: "1m30", tag: ""},
            {id: 'd5', name: "Face pull", reps: "3x15", time: "1m30", tag: ""},
            {id: 'd6', name: "Tríceps francês polia", reps: "3x12", time: "1m30", tag: ""},
            {id: 'd7', name: "Rosca martelo", reps: "3x12", time: "1m30", tag: ""}
        ]},
        treinoE: { title: "Treino E - Posterior", exercises: [
            {id: 'e1', name: "Levantamento terra", reps: "3x6-8", time: "Nec.", tag: ""},
            {id: 'e2', name: "Mesa flexora", reps: "4x12", time: "1m30", tag: ""},
            {id: 'e3', name: "Elevação pélvica", reps: "3x12", time: "Nec.", tag: ""},
            {id: 'e4', name: "Cadeira abdutora", reps: "3x13", time: "1m", tag: ""},
            {id: 'e5', name: "Afundo halteres", reps: "3x12", time: "1m", tag: ""}
        ]}
    };

    let workouts = {};

    function init() {
        const saved = localStorage.getItem('rafa_workout_v3');
        workouts = saved ? JSON.parse(saved) : defaultWorkouts;
        renderAll();
    }

    function renderAll() {
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        const currentActive = document.querySelector('.tab-btn.active')?.innerText || 'A';
        
        for (let key in workouts) {
            let section = document.createElement('div');
            section.id = key;
            section.className = `workout-content ${key.endsWith(currentActive) ? 'active' : ''}`;
            
            let html = `<h2>${workouts[key].title}</h2>`;
            workouts[key].exercises.forEach(ex => {
                const isChecked = localStorage.getItem('check_'+ex.id) === 'true';
                const weight = localStorage.getItem('weight_'+ex.id) || '';
                html += `
                <div class="exercise-card ${isChecked ? 'completed' : ''}" id="card_${ex.id}">
                    <button class="btn-remove" onclick="removeEx('${key}', '${ex.id}')">✕</button>
                    <label class="custom-checkbox"><input type="checkbox" onchange="toggleCheck('${ex.id}', this)" ${isChecked ? 'checked' : ''}><span class="checkmark"></span></label>
                    <div class="ex-data">
                        <div class="ex-header">
                            <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' execução')}" target="_blank" class="ex-name">${ex.name}</a>
                            ${ex.tag ? `<span class="tag">${ex.tag}</span>` : ''}
                        </div>
                        <div class="ex-info">
                            <div class="info-item"><span class="info-label">Reps</span><span class="info-value">${ex.reps}</span></div>
                            <div class="info-item"><span class="info-label">Peso</span><input type="text" class="weight-input" value="${weight}" placeholder="0kg" onchange="saveWeight('${ex.id}', this.value)"></div>
                            <div class="info-item"><span class="info-label">Tempo</span><span class="info-value ${ex.time !== 'Nec.' ? 'timer-trigger' : ''}" onclick="startTimer('${ex.time}')">${ex.time}</span></div>
                        </div>
                    </div>
                </div>`;
            });
            html += `<button class="btn-add" onclick="addEx('${key}')">+ Adicionar Exercício</button>`;
            section.innerHTML = html;
            container.appendChild(section);
        }
    }

    function toggleEditMode() { document.body.classList.toggle('edit-mode'); }

    function addEx(key) {
        const name = prompt("Nome:"); if(!name) return;
        const reps = prompt("Séries/Reps:", "3x12");
        const time = prompt("Descanso:", "1m30");
        const tag = prompt("Tag (ex: Pesado, Drop ou deixe vazio):", "");
        workouts[key].exercises.push({id: 'ex_'+Date.now(), name, reps, time, tag});
        saveData();
    }

    function removeEx(key, id) { if(confirm("Remover?")) { workouts[key].exercises = workouts[key].exercises.filter(ex => ex.id !== id); saveData(); } }
    
    function saveData() { localStorage.setItem('rafa_workout_v3', JSON.stringify(workouts)); renderAll(); }
    function toggleCheck(id, el) { localStorage.setItem('check_'+id, el.checked); document.getElementById('card_'+id).classList.toggle('completed', el.checked); }
    function saveWeight(id, val) { localStorage.setItem('weight_'+id, val); }

    function showWorkout(id, btn) {
        document.querySelectorAll('.workout-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    let timerInterval;
    function startTimer(t) {
        if (t === 'Nec.' || t === 'Necessário') return;
        stopTimer();
        let sec = t.includes('m') ? parseInt(t.split('m')[0])*60 + (parseInt(t.split('m')[1])||0) : parseInt(t);
        const display = document.getElementById('timer-widget');
        display.style.display = 'flex';
        timerInterval = setInterval(() => {
            sec--; display.innerText = sec;
            if (sec <= 0) {
                clearInterval(timerInterval);
                display.style.background = 'var(--success)';
                try {
                    const ctx = new AudioContext(); const osc = ctx.createOscillator();
                    osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.2);
                } catch(e){}
                setTimeout(stopTimer, 2000);
            }
        }, 1000);
    }
    function stopTimer() { clearInterval(timerInterval); document.getElementById('timer-widget').style.display = 'none'; document.getElementById('timer-widget').style.background = 'var(--accent)'; }
</script>
</body>
</html>
