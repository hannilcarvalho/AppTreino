<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Pro</title>
    <meta name="mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-main: radial-gradient(circle at top right, #1e293b, #0f172a);
            --header-bg: rgba(15, 23, 42, 0.9);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --accent: #f472b6;
            --success: #4ade80;
            --danger: #ef4444;
            --gold: #fbbf24;
        }

        [data-theme="light"] {
            --bg-main: radial-gradient(circle at top right, #f1f5f9, #e2e8f0);
            --header-bg: rgba(255, 255, 255, 0.95);
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border: rgba(0, 0, 0, 0.1);
            --primary: #0284c7;
            --accent: #db2777;
            --success: #16a34a;
            --danger: #dc2626;
        }

        /* Animação de entrada das abas */
        @keyframes tabFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content-animate {
            animation: tabFadeIn 0.3s ease-out forwards;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-main);
            color: var(--text-main); 
            margin: 0; padding-bottom: 120px; 
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        header { 
            width: 100%; padding: 25px 0; text-align: center; 
            background: var(--header-bg); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1100;
        }
        header h1 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: 2px; color: var(--primary); text-transform: uppercase; }

        #tabs-wrapper { width: 100%; max-width: 500px; margin: 0 auto; border-bottom: 1px solid var(--border); }
        .tabs-container { display: flex; background: rgba(0,0,0,0.05); overflow-x: auto; }
        
        .tab-btn-wrapper { position: relative; flex: 1; display: flex; }
        .tab-btn { background: none; border: none; color: var(--text-dim); font-weight: 800; font-size: 1.1rem; padding: 18px; width: 100%; transition: 0.2s; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); box-shadow: inset 0 -3px 0 var(--primary); }
        
        .btn-tab-manage {
            position: absolute; top: 2px; right: 2px; background: var(--danger); color: white;
            border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px;
            cursor: pointer; display: none; z-index: 5; font-weight: bold; align-items: center; justify-content: center;
        }
        .edit-mode .btn-tab-manage { display: flex; }
        
        .tab-controls { display: flex; justify-content: center; padding: 10px; background: rgba(0,0,0,0.1); }
        .btn-add-tab { background: var(--card-bg); border: 1px dashed var(--primary); color: var(--primary); padding: 5px 15px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }

        .summary-card {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border-radius: 20px; padding: 20px; margin: 20px auto 10px auto;
            max-width: 480px; width: calc(100% - 40px); border: 1px solid var(--border);
            text-align: center; box-sizing: border-box;
        }
        .summary-text { font-size: 0.85rem; font-weight: 800; margin-bottom: 12px; }
        .summary-bar-bg { background: rgba(0,0,0,0.1); border-radius: 10px; height: 8px; width: 100%; overflow: hidden; }
        .summary-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.5s ease; }

        .container { width: 100%; max-width: 480px; padding: 0 20px 20px 20px; box-sizing: border-box; margin: 0 auto; }
        h2 { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin: 25px 0 15px 0; display: flex; align-items: center; justify-content: space-between; }

        .exercise-card { 
            background: var(--card-bg); backdrop-filter: blur(12px);
            border-radius: 22px; padding: 22px; margin-bottom: 18px; 
            border: 1px solid var(--border); border-left: 5px solid var(--primary); 
            display: flex; align-items: flex-start; gap: 15px; position: relative; transition: all 0.3s ease;
        }
        .exercise-card.completed { opacity: 0.4; transform: scale(0.96); filter: grayscale(1); border-left-color: var(--success); }

        .btn-remove { display: none; position: absolute; right: -8px; top: -8px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 26px; height: 26px; font-weight: bold; cursor: pointer; z-index: 10; align-items: center; justify-content: center; }
        .btn-edit-ex { display: none; position: absolute; right: 26px; top: -8px; background: var(--primary); color: white; border: none; border-radius: 50%; width: 26px; height: 26px; font-weight: bold; cursor: pointer; z-index: 10; font-size: 14px; align-items: center; justify-content: center; }
        
        .edit-mode .btn-remove, .edit-mode .btn-edit-ex { display: flex; }

        .custom-checkbox { min-width: 30px; height: 30px; position: relative; cursor: pointer; }
        .custom-checkbox input { opacity: 0; width: 0; height: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 30px; width: 30px; border: 2px solid var(--border); border-radius: 12px; }
        .custom-checkbox input:checked ~ .checkmark { background: var(--success); border-color: var(--success); }
        .checkmark:after { content: ""; position: absolute; display: none; left: 10px; top: 5px; width: 6px; height: 11px; border: solid white; border-width: 0 3px 3px 0; transform: rotate(45deg); }
        .custom-checkbox input:checked ~ .checkmark:after { display: block; }

        .ex-name { font-weight: 800; font-size: 1.05rem; color: var(--text-main); display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .info-label { font-size: 0.55rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; }
        .info-value { font-size: 0.9rem; font-weight: 700; color: var(--text-main); }
        .timer-trigger { color: var(--accent); border-bottom: 1px dotted var(--accent); cursor: pointer; }
        .weight-input { background: rgba(0,0,0,0.1); border: 1px solid var(--border); border-radius: 8px; color: var(--success); padding: 5px; width: 55px; font-weight: 800; text-align: center; transition: 0.3s; }
        
        .weight-input.pr-active { color: var(--gold) !important; border-color: var(--gold) !important; box-shadow: 0 0 8px rgba(251, 191, 36, 0.3); }
        
        .exercise-note { width: 100%; display: none; margin-top: 5px; background: rgba(0,0,0,0.1); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); padding: 8px; box-sizing: border-box; font-family: 'Inter', sans-serif; resize: vertical; font-size: 0.85rem; transition: 0.3s; }
        .exercise-note.show { display: block; }

        /* --- TIMER APRIMORADO --- */
        #timer-widget { 
            position: fixed; bottom: 35px; left: 35px; width: 80px; height: 80px; 
            display: none; align-items: center; justify-content: center; z-index: 2000; 
            cursor: pointer; background: var(--card-bg); border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }
        #timer-widget svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        .ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 6; }
        .ring-progress {
            fill: none; stroke: var(--primary); stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 283; /* Circunferência de raio 45 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }
        #timer-text { position: relative; font-weight: 800; font-size: 1.5rem; color: var(--text-main); z-index: 2; }
        /* ------------------------ */

        .fab-container { position: fixed; bottom: 35px; right: 35px; z-index: 2000; display: flex; flex-direction: column; align-items: flex-end; }
        .fab-menu { display: none; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .fab-menu.show { display: flex; }
        .fab-item { background: var(--card-bg); backdrop-filter: blur(15px); border: 1px solid var(--border); color: var(--text-main); padding: 12px 20px; border-radius: 25px; font-weight: 800; font-size: 0.85rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); white-space: nowrap; display: flex; align-items: center; gap: 10px; }
        .fab-btn { width: 65px; height: 65px; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 2rem; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.3); transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .fab-btn.active { transform: rotate(45deg); background: var(--danger); }
        
        .empty-state { text-align: center; padding: 40px; color: var(--text-dim); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 25px; border-radius: 20px; max-width: 90%; width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 20px 0; }
        .heat-square { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; opacity: 0.9; }

        @media (min-width: 1024px) {
            body { padding-bottom: 0; }
            header { 
                position: fixed; left: 0; top: 0; width: 260px; height: 100vh; 
                background: var(--header-bg); border-right: 1px solid var(--border); border-bottom: none; 
                z-index: 100; padding: 40px 0; display: flex; flex-direction: column; 
            }
            .desktop-side-actions { 
                margin-top: auto; margin-bottom: 120px; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; 
            }
            .desktop-side-actions button { 
                background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; 
                cursor: pointer; font-size: 0.8rem; font-weight: 800; color: var(--text-main); text-align: left; transition: 0.2s;
                display: flex; align-items: center; gap: 10px;
            }
            .desktop-side-actions button:hover { filter: brightness(1.2); }
            
            #tabs-wrapper { position: fixed; left: 20px; top: 100px; width: 220px; max-width: none; border: none; z-index: 101; background: transparent; }
            .tabs-container { flex-direction: column; background: transparent; gap: 8px; overflow: visible; }
            .tab-btn { text-align: left; padding: 12px 20px; font-size: 0.95rem; border-radius: 10px; }
            .tab-btn.active { background: var(--primary); color: white; box-shadow: none; }
            
            .tab-controls { display: none !important; }
            
            .summary-card { position: fixed; right: 30px; bottom: 30px; width: 250px; margin: 0; z-index: 102; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
            
            .action-bar-desktop {
                margin-left: 280px; max-width: 1200px; width: calc(100% - 280px); 
                padding: 40px 20px 0 20px; box-sizing: border-box; 
                display: flex !important; gap: 15px; margin-bottom: 10px; flex-wrap: wrap;
            }
            .action-bar-desktop button {
                background: var(--card-bg); border: 1px solid var(--border); padding: 10px 20px; 
                border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 800; 
                color: var(--text-main); transition: 0.2s; display: flex; align-items: center; gap: 8px;
            }
            .action-bar-desktop button:hover { filter: brightness(1.2); }

            .container { margin-left: 280px; max-width: 1200px; width: calc(100% - 280px); padding-top: 10px; }
            #main-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; align-items: start; }
            h2 { grid-column: 1 / -1; font-size: 1.6rem; margin-bottom: 30px; }
            
            .fab-container { display: none; }
            .desktop-only { display: flex !important; }
        }
        @media (max-width: 1023px) {
            .desktop-only { display: none !important; }
        }
    </style>
</head>
<body onload="init()">

<header>
    <h1>TRAINING PRO</h1>
    <div class="desktop-side-actions desktop-only">
        <button onclick="fabEdit()" id="desktop-edit-btn"><i class="ph-bold ph-gear"></i> Modo Edição</button>
        <button onclick="toggleTheme()"><i class="ph-bold ph-sun-dim"></i> Mudar Tema</button>
        <button onclick="exportData()"><i class="ph-bold ph-download-simple"></i> Exportar Backup</button>
        <button onclick="document.getElementById('import-file').click()"><i class="ph-bold ph-upload-simple"></i> Importar Backup</button>
    </div>
</header>

<div id="tabs-wrapper">
    <div class="tabs-container" id="tabs-list"></div>
    <div class="tab-controls">
        <button class="btn-add-tab" onclick="addTab()"><i class="ph-bold ph-plus"></i> Nova Aba</button>
    </div>
</div>

<div class="summary-card">
    <div class="summary-text" id="summary-text">Carregando...</div>
    <div class="summary-bar-bg"><div class="summary-bar-fill" id="summary-bar-fill"></div></div>
</div>

<div class="action-bar-desktop desktop-only">
    <button onclick="addTab()" style="color: var(--primary); border-color: var(--primary);"><i class="ph-bold ph-plus"></i> Nova Aba</button>
    <button onclick="fabAdd()" style="color: var(--primary); border-color: var(--primary);"><i class="ph-bold ph-plus-circle"></i> Novo Exercício</button>
    <button onclick="fabReset()"><i class="ph-bold ph-arrows-counter-clockwise"></i> Limpar Hoje</button>
    <button onclick="openHistory()" style="background: var(--primary); color: white; border: none;"><i class="ph-bold ph-calendar"></i> Frequência</button>
</div>

<div class="container" id="main-container"></div>

<div id="timer-widget" onclick="stopTimer()">
    <svg viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
        <circle class="ring-progress" id="progress-ring" cx="50" cy="50" r="45"></circle>
    </svg>
    <div id="timer-text">00</div>
</div>

<input type="file" id="import-file" style="display:none" onchange="importData(event)">

<div class="fab-container">
    <div class="fab-menu" id="fab-menu">
        <div class="fab-item" onclick="exportData()"><i class="ph-bold ph-download-simple"></i> Exportar Backup</div>
        <div class="fab-item" onclick="document.getElementById('import-file').click()"><i class="ph-bold ph-upload-simple"></i> Importar Backup</div>
        <hr style="width:100%; border:0; border-top:1px solid var(--border); margin:4px 0;">
        <div class="fab-item" onclick="openHistory()"><i class="ph-bold ph-calendar"></i> Frequência de Treino</div>
        <div class="fab-item" onclick="toggleTheme()"><i class="ph-bold ph-moon"></i> Mudar Tema</div>
        <div class="fab-item" onclick="fabReset()"><i class="ph-bold ph-arrows-counter-clockwise"></i> Limpar Treino</div>
        <div class="fab-item" onclick="fabEdit()" id="edit-fab-text"><i class="ph-bold ph-gear"></i> Modo Edição</div>
        <div class="fab-item" onclick="fabAdd()" style="color: var(--primary);"><i class="ph-bold ph-plus"></i> Novo Exercício</div>
    </div>
    <button class="fab-btn" id="fab-btn" onclick="toggleFab()"><i class="ph-bold ph-plus"></i></button>
</div>

<div class="modal-overlay" id="history-modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--text-main); display:flex; align-items:center; justify-content:center; gap:8px;">
            <i class="ph-bold ph-calendar-check"></i> Atividade (30 dias)
        </h3>
        <p style="font-size:0.75rem; color:var(--text-dim); margin-top:-10px;">Dias em verde indicam treinos concluídos.</p>
        <div class="heatmap-grid" id="heatmap-grid"></div>
        <button onclick="document.getElementById('history-modal').style.display='none'" style="width:100%; padding:12px; border-radius:10px; background:var(--primary); color:white; border:none; font-weight:bold; cursor:pointer;">Fechar</button>
    </div>
</div>

<script>
    const defaultWorkouts = {
        treinoA: { title: "Peito e Tríceps", exercises: [
            {id: 'a1', name: "Supino inclinado halteres", reps: "2x12 + 2x8", time: "1m30"},
            {id: 'a2', name: "Supino reto barra", reps: "4x12", time: "1m30"},
            {id: 'a3', name: "Voador", reps: "3x12 (2s iso)", time: "1m30"},
            {id: 'a4', name: "Crossover baixo", reps: "3x12", time: "1m30"},
            {id: 'a5', name: "Paralelas", reps: "3x máx", time: "1m30"},
            {id: 'a6', name: "Elevação lateral sentado", reps: "3x12 + 1 drop", time: "1m30"},
            {id: 'a7', name: "Tríceps testa halter", reps: "3x12", time: "1m30"},
            {id: 'a8', name: "Tríceps corda", reps: "2x12 + 1x10 drop", time: "1m30"}
        ]},
        treinoB: { title: "Costas e Bíceps", exercises: [
            {id: 'b1', name: "Barra fixa pronada", reps: "40 reps totais", time: "1m30"},
            {id: 'b2', name: "Remada curvada", reps: "2x12 + 2x8", time: "Nec."},
            {id: 'b3', name: "Puxador triângulo", reps: "3x15", time: "1m"},
            {id: 'b4', name: "Pulldown", reps: "4x12", time: "1m30"},
            {id: 'b5', name: "Remada baixa aberta", reps: "3x10 + drop", time: "1m30"},
            {id: 'b6', name: "Rosca alternada", reps: "3x12", time: "1m"},
            {id: 'b7', name: "Rosca Scott máquina", reps: "3x12", time: "1m30"},
            {id: 'b8', name: "Encolhimento ombros", reps: "3x15", time: "Nec."}
        ]},
        treinoC: { title: "Perna Anterior", exercises: [
            {id: 'c1', name: "Cadeira adutora", reps: "3x15", time: "1m30"},
            {id: 'c2', name: "Agachamento hack", reps: "3x10-12", time: "1m30"},
            {id: 'c3', name: "Leg 45°", reps: "2x12 + 2x8", time: "Nec."},
            {id: 'c4', name: "Cadeira extensora", reps: "3x15 + drop", time: "1m30"},
            {id: 'c5', name: "Stiff", reps: "4x12", time: "1m30"},
            {id: 'c6', name: "Panturrilha em pé", reps: "3x falha", time: "1m30"},
            {id: 'c7', name: "Panturrilha sentada", reps: "3x falha", time: "1m30"}
        ]},
        treinoD: { title: "Ombros e Braços", exercises: [
            {id: 'd1', name: "Desenvolvimento halteres", reps: "2x12 + 2x8", time: "1m30"},
            {id: 'd2', name: "Elevação lateral halter", reps: "3x15 + drop", time: "Nec."},
            {id: 'd3', name: "Elevação lateral máquina", reps: "3x12", time: "1m30"},
            {id: 'd4', name: "Crucifixo inverso", reps: "3x15", time: "1m30"},
            {id: 'd5', name: "Face pull", reps: "3x15", time: "1m30"},
            {id: 'd6', name: "Tríceps francês polia", reps: "3x12", time: "1m30"},
            {id: 'd7', name: "Rosca martelo", reps: "3x12", time: "1m30"}
        ]},
        treinoE: { title: "Perna Posterior", exercises: [
            {id: 'e1', name: "Levantamento terra", reps: "3x6-8", time: "Nec."},
            {id: 'e2', name: "Mesa flexora", reps: "4x12", time: "1m30"},
            {id: 'e3', name: "Elevação pélvica", reps: "3x12", time: "Nec."},
            {id: 'e4', name: "Cadeira abdutora", reps: "3x13", time: "1m"},
            {id: 'e5', name: "Afundo halteres", reps: "3x12", time: "1m"}
        ]}
    };

    let workoutData = {};
    let currentTabKey = 'treinoA';

    function init() {
        const theme = localStorage.getItem('app_theme') || 'dark';
        document.body.setAttribute('data-theme', theme);
        const saved = localStorage.getItem('app_workout_data');
        workoutData = saved ? JSON.parse(saved) : defaultWorkouts;
        
        currentTabKey = Object.keys(workoutData)[0] || 'treinoA';
        checkAutoReset();
        renderTabs();
        renderAll();
    }

    function renderTabs() {
        const list = document.getElementById('tabs-list');
        let html = '';
        Object.keys(workoutData).forEach(key => {
            const isActive = key === currentTabKey ? 'active' : '';
            html += `
                <div class="tab-btn-wrapper">
                    <button class="btn-tab-manage" onclick="deleteTab('${key}')"><i class="ph-bold ph-x"></i></button>
                    <button class="tab-btn ${isActive}" onclick="showWorkout('${key}', this)" oncontextmenu="renameTab('${key}'); return false;">
                        ${workoutData[key].label}
                    </button>
                </div>`;
        });
        list.innerHTML = html;
    }

    function renderAll() {
        const container = document.getElementById('main-container');
        const data = workoutData[currentTabKey];
        if(!data) return;

        // Reset animação
        container.classList.remove('tab-content-animate');
        void container.offsetWidth; // Trigger reflow
        container.classList.add('tab-content-animate');

        let html = `<h2>${data.title} <i class="ph-bold ph-pencil-simple" onclick="editTitle()" style="cursor:pointer; opacity:0.5; font-size:14px"></i></h2>`;
        
        if (data.exercises.length === 0) {
            html += `<div class="empty-state"><i class="ph-bold ph-Barbell" style="font-size:3rem; opacity:0.2"></i><p>Nenhum exercício cadastrado.</p></div>`;
        } else {
            data.exercises.forEach(ex => {
                const isChecked = localStorage.getItem('check_'+ex.id) === 'true';
                const weight = localStorage.getItem('weight_'+ex.id) || '';
                const noteVal = localStorage.getItem('note_'+ex.id) || '';
                
                const prStr = localStorage.getItem('pr_'+ex.id);
                const prNum = prStr ? parseFloat(prStr) : 0;
                const currentNum = parseFloat(weight.replace(',', '.').replace(/[^0-9.]/g, ''));
                const isPR = (!isNaN(currentNum) && currentNum >= prNum && prNum > 0);

                html += `
                <div class="exercise-card ${isChecked ? 'completed' : ''}" id="card_${ex.id}">
                    <button class="btn-remove" onclick="removeEx('${currentTabKey}', '${ex.id}')"><i class="ph-bold ph-x"></i></button>
                    <button class="btn-edit-ex" onclick="editEx('${currentTabKey}', '${ex.id}')"><i class="ph-bold ph-pencil-simple"></i></button>
                    <label class="custom-checkbox">
                        <input type="checkbox" onchange="toggleCheck('${ex.id}', this)" ${isChecked ? 'checked' : ''}>
                        <span class="checkmark"></span>
                    </label>
                    <div style="flex-grow:1; width:100%;">
                        <span class="ex-name">
                            ${ex.name}
                            ${ex.link ? `<a href="${ex.link}" target="_blank" style="color:var(--primary);"><i class="ph-bold ph-youtube-logo"></i></a>` : ''}
                            <i class="ph-bold ph-note-pencil" onclick="toggleNote('${ex.id}')" style="cursor:pointer; opacity:0.5; font-size:1.1rem"></i>
                        </span>
                        
                        <textarea class="exercise-note" id="note_${ex.id}" onchange="saveNote('${ex.id}', this.value)" placeholder="Dicas (ex: banco altura 3)...">${noteVal}</textarea>
                        
                        <div style="display:flex; gap:20px; margin-top:10px">
                            <div><span class="info-label">Séries</span><br><span class="info-value">${ex.reps}</span></div>
                            <div>
                                <span class="info-label" style="${isPR ? 'color:var(--gold)' : ''}">Peso ${isPR ? '<i class="ph-fill ph-trophy" style="color:var(--gold)"></i>' : ''}</span><br>
                                <input type="text" id="weight_${ex.id}" class="weight-input ${isPR ? 'pr-active' : ''}" value="${weight}" onchange="saveWeight('${ex.id}', this.value)" placeholder="0kg">
                            </div>
                            <div><span class="info-label">Pausa</span><br><span class="info-value ${ex.time !== 'Nec.' ? 'timer-trigger' : ''}" onclick="startTimer('${ex.time}')">${ex.time}</span></div>
                        </div>
                    </div>
                </div>`;
            });
        }
        container.innerHTML = html;
        updateProgressBar();
    }

    function showWorkout(key, btn) { currentTabKey = key; renderTabs(); renderAll(); }

    function addTab() {
        const name = prompt("Nome da aba (ex: Pernas):");
        if(name) {
            const id = 'treino' + Date.now();
            workoutData[id] = { label: name.toUpperCase().substring(0, 10), title: name, exercises: [] };
            saveData(); currentTabKey = id; renderTabs(); renderAll();
        }
    }

    function renameTab(key) {
        if(!document.body.classList.contains('edit-mode')) return;
        const n = prompt("Novo nome da aba:", workoutData[key].label);
        if(n) { workoutData[key].label = n.toUpperCase().substring(0, 10); saveData(); renderTabs(); }
    }

    function deleteTab(key) {
        if(Object.keys(workoutData).length <= 1) return alert("Mantenha ao menos um treino.");
        if(confirm(`Excluir aba "${workoutData[key].label}"?`)) {
            delete workoutData[key]; currentTabKey = Object.keys(workoutData)[0]; saveData(); renderTabs(); renderAll();
        }
    }

    function editTitle() {
        const t = prompt("Novo título:", workoutData[currentTabKey].title);
        if(t) { workoutData[currentTabKey].title = t; saveData(); renderAll(); }
    }

    function editEx(key, id) {
        const ex = workoutData[key].exercises.find(e => e.id === id);
        if(!ex) return;
        const newName = prompt("Nome:", ex.name);
        if(newName) ex.name = newName;
        ex.reps = prompt("Séries/Reps:", ex.reps) || ex.reps;
        ex.time = prompt("Pausa:", ex.time) || ex.time;
        ex.link = prompt("Link Youtube (opcional):", ex.link || "");
        saveData(); renderAll();
    }

    function toggleCheck(id, el) {
        localStorage.setItem('check_'+id, el.checked);
        if(el.checked) {
            localStorage.setItem('app_last_active', Date.now());
            const d = new Date();
            const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            const history = JSON.parse(localStorage.getItem('app_history') || '{}');
            history[dateStr] = true;
            localStorage.setItem('app_history', JSON.stringify(history));
        }
        document.getElementById('card_'+id).classList.toggle('completed', el.checked);
        updateProgressBar();
    }

    function updateProgressBar() {
        const exes = workoutData[currentTabKey].exercises;
        const checked = exes.filter(ex => localStorage.getItem('check_'+ex.id) === 'true').length;
        const percent = exes.length > 0 ? Math.round((checked / exes.length) * 100) : 0;
        document.getElementById('summary-text').innerText = `${checked} de ${exes.length} concluídos (${percent}%)`;
        document.getElementById('summary-bar-fill').style.width = percent + '%';
    }

    function toggleFab() { 
        document.getElementById('fab-menu').classList.toggle('show'); 
        document.getElementById('fab-btn').classList.toggle('active'); 
    }
    
    function closeFabMobile() { if(window.innerWidth < 1024 && document.getElementById('fab-menu').classList.contains('show')) toggleFab(); }

    function fabEdit() { 
        document.body.classList.toggle('edit-mode'); 
        const isEdit = document.body.classList.contains('edit-mode');
        const text = isEdit ? `<i class="ph-bold ph-check"></i> Sair Edição` : `<i class="ph-bold ph-gear"></i> Modo Edição`;
        document.getElementById('edit-fab-text').innerHTML = text;
        if(document.getElementById('desktop-edit-btn')) document.getElementById('desktop-edit-btn').innerHTML = text;
        closeFabMobile(); 
    }

    function fabAdd() {
        const name = prompt("Nome do exercício:");
        if(name) {
            workoutData[currentTabKey].exercises.push({ 
                id: 'ex_'+Date.now(), 
                name, 
                reps: prompt("Reps:", "3x12"), 
                time: prompt("Pausa:", "1m30"), 
                link: "" 
            });
            saveData(); renderAll();
        }
        closeFabMobile();
    }

    function fabReset() {
        if(confirm("Limpar marcações de hoje?")) {
            workoutData[currentTabKey].exercises.forEach(ex => localStorage.setItem('check_'+ex.id, 'false'));
            renderAll();
        }
        closeFabMobile();
    }

    function removeEx(key, id) { workoutData[key].exercises = workoutData[key].exercises.filter(ex => ex.id !== id); saveData(); renderAll(); }
    
    function saveWeight(id, val) { 
        localStorage.setItem('weight_'+id, val); 
        const num = parseFloat(val.replace(',', '.').replace(/[^0-9.]/g, ''));
        if(!isNaN(num)) {
            let pr = parseFloat(localStorage.getItem('pr_'+id)) || 0;
            if(num > pr) localStorage.setItem('pr_'+id, num);
        }
        renderAll();
    }

    function toggleNote(id) { document.getElementById('note_'+id).classList.toggle('show'); }
    function saveNote(id, val) { localStorage.setItem('note_'+id, val); }
    function saveData() { localStorage.setItem('app_workout_data', JSON.stringify(workoutData)); }

    function toggleTheme() {
        const current = document.body.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', next);
        localStorage.setItem('app_theme', next);
        closeFabMobile();
    }

    function openHistory() {
        const grid = document.getElementById('heatmap-grid');
        grid.innerHTML = '';
        const history = JSON.parse(localStorage.getItem('app_history') || '{}');
        const today = new Date();

        for(let i=27; i>=0; i--) {
            const d = new Date();
            d.setDate(today.getDate() - i);
            const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            const didWorkout = history[dateStr];
            
            const square = document.createElement('div');
            square.className = 'heat-square';
            square.style.background = didWorkout ? 'var(--success)' : 'rgba(0,0,0,0.1)';
            square.innerText = d.getDate();
            grid.appendChild(square);
        }
        document.getElementById('history-modal').style.display = 'flex';
        closeFabMobile();
    }

    function exportData() {
        const weights = {};
        for(let i=0; i<localStorage.length; i++){
            let key = localStorage.key(i);
            if(key.startsWith('weight_') || key.startsWith('note_') || key.startsWith('pr_') || key === 'app_history') {
                weights[key] = localStorage.getItem(key);
            }
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({workoutData, weights}));
        const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "backup_treino.json"); dl.click();
        closeFabMobile();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const d = JSON.parse(e.target.result);
            if(d.weights) Object.keys(d.weights).forEach(k => localStorage.setItem(k, d.weights[k]));
            if(d.workoutData) { workoutData = d.workoutData; saveData(); }
            location.reload();
        };
        reader.readAsText(event.target.files[0]);
    }

    /* --- LÓGICA DO TIMER APRIMORADO --- */
    let timerInterval;
    function startTimer(t) {
        if(t === 'Nec.') return;
        stopTimer();
        
        let totalSec = t.includes('m') ? parseInt(t.split('m')[0])*60 + (parseInt(t.split('m')[1])||0) : parseInt(t);
        let sec = totalSec;
        
        const widget = document.getElementById('timer-widget');
        const text = document.getElementById('timer-text');
        const ring = document.getElementById('progress-ring');
        const circumference = 283; // 2 * PI * R(45)
        
        widget.style.display = 'flex';
        ring.style.strokeDashoffset = 0;
        ring.style.stroke = 'var(--primary)'; // Cor inicial
        text.innerText = sec;

        timerInterval = setInterval(() => {
            sec--;
            text.innerText = sec;
            
            // Atualiza o anel de progresso
            const offset = circumference - (sec / totalSec) * circumference;
            ring.style.strokeDashoffset = offset;

            // Mudança de cores progressiva
            if (sec <= totalSec * 0.2) {
                ring.style.stroke = 'var(--danger)'; // Vermelho nos últimos 20%
            } else if (sec <= totalSec * 0.5) {
                ring.style.stroke = 'var(--gold)'; // Amarelo na metade
            }

            if(sec <= 0) { 
                clearInterval(timerInterval); 
                text.innerText = "OK";
                ring.style.stroke = 'var(--success)'; // Fica verde ao terminar
                if(navigator.vibrate) navigator.vibrate([200, 100, 200]); // Vibra ao terminar
                setTimeout(stopTimer, 2500); // Fecha automaticamente depois de 2,5s
            }
        }, 1000);
    }

    function stopTimer() { 
        clearInterval(timerInterval); 
        document.getElementById('timer-widget').style.display = 'none'; 
    }
    /* ----------------------------------- */

    function checkAutoReset() {
        const last = localStorage.getItem('app_last_active');
        if (last && (Date.now() - parseInt(last)) > (12 * 60 * 60 * 1000)) {
            Object.keys(workoutData).forEach(k => workoutData[k].exercises.forEach(ex => localStorage.setItem('check_'+ex.id, 'false')));
        }
    }
</script>
