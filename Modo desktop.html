<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Pro - Desktop Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --accent: #f472b6;
            --success: #4ade80;
            --danger: #ef4444;
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --sidebar-bg: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border: rgba(0, 0, 0, 0.1);
            --primary: #0284c7;
            --accent: #db2777;
            --success: #16a34a;
            --danger: #dc2626;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main);
            color: var(--text-main); 
            margin: 0; 
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* SIDEBAR - Lado Esquerdo */
        aside {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            z-index: 100;
        }

        header h1 { 
            font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; 
            color: var(--primary); text-transform: uppercase; margin-bottom: 40px;
        }

        .nav-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; }
        .tab-btn { 
            background: transparent; border: 1px solid transparent; color: var(--text-dim);
            padding: 12px 20px; text-align: left; border-radius: 12px;
            font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .tab-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-main); }
        .tab-btn.active { 
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .summary-box {
            background: var(--bg-main); border-radius: 15px; padding: 15px;
            margin-top: auto; border: 1px solid var(--border);
        }
        .summary-text { font-size: 0.75rem; font-weight: 800; margin-bottom: 10px; }
        .summary-bar-bg { background: rgba(0,0,0,0.1); border-radius: 10px; height: 6px; overflow: hidden; }
        .summary-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.5s ease; }

        /* CONTEÚDO PRINCIPAL - Lado Direito */
        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-header {
            width: 100%; max-width: 800px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px;
        }

        h2 { font-size: 1.5rem; margin: 0; color: var(--text-main); }

        .actions-bar { display: flex; gap: 10px; }
        .action-btn {
            background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-main); padding: 8px 15px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { transform: translateY(-2px); border-color: var(--primary); }

        .exercise-grid {
            width: 100%; max-width: 800px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .exercise-card { 
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 20px; border: 1px solid var(--border);
            border-left: 4px solid var(--primary); display: flex; gap: 15px;
            position: relative; transition: 0.3s;
        }
        .exercise-card:hover { border-color: var(--primary); }
        .exercise-card.completed { opacity: 0.5; filter: grayscale(0.8); border-left-color: var(--success); }

        .weight-input { 
            background: rgba(0,0,0,0.05); border: 1px solid var(--border); 
            border-radius: 6px; color: var(--success); padding: 4px; 
            width: 60px; font-weight: 800; text-align: center;
        }

        .btn-remove { 
            position: absolute; right: 10px; top: 10px; background: var(--danger); 
            color: white; border: none; border-radius: 50%; width: 22px; height: 22px; 
            cursor: pointer; opacity: 0; transition: 0.2s;
        }
        .edit-mode .btn-remove { opacity: 1; }

        /* WIDGETS */
        #timer-widget { 
            position: fixed; bottom: 30px; right: 30px; width: 80px; height: 80px; 
            background: var(--accent); border-radius: 50%; display: none; 
            align-items: center; justify-content: center; font-weight: 800; 
            font-size: 1.5rem; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer; z-index: 1000;
        }

        .custom-checkbox { min-width: 24px; height: 24px; position: relative; cursor: pointer; }
        .custom-checkbox input { opacity: 0; width: 0; height: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 24px; width: 24px; border: 2px solid var(--border); border-radius: 8px; }
        .custom-checkbox input:checked ~ .checkmark { background: var(--success); border-color: var(--success); }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-dim); }

    </style>
</head>
<body onload="init()">

<aside>
    <header><h1>Training Pro</h1></header>
    
    <div class="nav-group">
        <button class="tab-btn active" onclick="showWorkout('treinoA', this)">Treino A</button>
        <button class="tab-btn" onclick="showWorkout('treinoB', this)">Treino B</button>
        <button class="tab-btn" onclick="showWorkout('treinoC', this)">Treino C</button>
        <button class="tab-btn" onclick="showWorkout('treinoD', this)">Treino D</button>
        <button class="tab-btn" onclick="showWorkout('treinoE', this)">Treino E</button>
    </div>

    <div class="nav-group">
        <button class="action-btn" onclick="toggleTheme()">🌓 Alternar Tema</button>
        <button class="action-btn" onclick="exportData()">📥 Exportar Backup</button>
        <button class="action-btn" onclick="document.getElementById('import-file').click()">📤 Importar Backup</button>
    </div>

    <div class="summary-box">
        <div class="summary-text" id="summary-text">0 de 0 concluídos</div>
        <div class="summary-bar-bg"><div class="summary-bar-fill" id="summary-bar-fill"></div></div>
    </div>
</aside>

<main>
    <div class="content-header">
        <h2 id="workout-title">Peito e Tríceps</h2>
        <div class="actions-bar">
            <button class="action-btn" onclick="fabEdit()" id="edit-btn">⚙️ Editar</button>
            <button class="action-btn" onclick="fabAdd()" style="background: var(--primary); color: white; border: none;">+ Novo Exercício</button>
            <button class="action-btn" onclick="fabReset()" style="color: var(--danger)">🔄 Reset Dia</button>
        </div>
    </div>

    <div class="exercise-grid" id="main-container"></div>
</main>

<div id="timer-widget" onclick="stopTimer()">00</div>
<input type="file" id="import-file" style="display:none" onchange="importData(event)">

<script>
    // [MESMO OBJETO defaultWorkouts E LÓGICA DE FUNÇÕES DA VERSÃO MOBILE]
    const defaultWorkouts = {
        treinoA: { title: "Peito e Tríceps", exercises: [
            {id: 'a1', name: "Supino inclinado halteres", reps: "2x12 + 2x8", time: "1m30"},
            {id: 'a2', name: "Supino reto barra", reps: "4x12", time: "1m30"},
            {id: 'a3', name: "Voador", reps: "3x12 (2s iso)", time: "1m30"},
            {id: 'a4', name: "Crossover baixo", reps: "3x12", time: "1m30"},
            {id: 'a5', name: "Paralelas", reps: "3x máx", time: "1m30"},
            {id: 'a6', name: "Elevação lateral sentado", reps: "3x12 + 1 drop", time: "1m30"},
            {id: 'a7', name: "Tríceps testa halter", reps: "3x12", time: "1m30"},
            {id: 'a8', name: "Tríceps corda", reps: "2x12 + 1x10 drop", time: "1m30"}
        ]},
        treinoB: { title: "Costas e Bíceps", exercises: [
            {id: 'b1', name: "Barra fixa pronada", reps: "40 reps totais", time: "1m30"},
            {id: 'b2', name: "Remada curvada", reps: "2x12 + 2x8", time: "Nec."},
            {id: 'b3', name: "Puxador triângulo", reps: "3x15", time: "1m"},
            {id: 'b4', name: "Pulldown", reps: "4x12", time: "1m30"},
            {id: 'b5', name: "Remada baixa aberta", reps: "3x10 + drop", time: "1m30"},
            {id: 'b6', name: "Rosca alternada", reps: "3x12", time: "1m"},
            {id: 'b7', name: "Rosca Scott máquina", reps: "3x12", time: "1m30"},
            {id: 'b8', name: "Encolhimento ombros", reps: "3x15", time: "Nec."}
        ]},
        treinoC: { title: "Perna Anterior", exercises: [
            {id: 'c1', name: "Cadeira adutora", reps: "3x15", time: "1m30"},
            {id: 'c2', name: "Agachamento hack", reps: "3x10-12", time: "1m30"},
            {id: 'c3', name: "Leg 45°", reps: "2x12 + 2x8", time: "Nec."},
            {id: 'c4', name: "Cadeira extensora", reps: "3x15 + drop", time: "1m30"},
            {id: 'c5', name: "Stiff", reps: "4x12", time: "1m30"},
            {id: 'c6', name: "Panturrilha em pé", reps: "3x falha", time: "1m30"},
            {id: 'c7', name: "Panturrilha sentada", reps: "3x falha", time: "1m30"}
        ]},
        treinoD: { title: "Ombros e Braços", exercises: [
            {id: 'd1', name: "Desenvolvimento halteres", reps: "2x12 + 2x8", time: "1m30"},
            {id: 'd2', name: "Elevação lateral halter", reps: "3x15 + drop", time: "Nec."},
            {id: 'd3', name: "Elevação lateral máquina", reps: "3x12", time: "1m30"},
            {id: 'd4', name: "Crucifixo inverso", reps: "3x15", time: "1m30"},
            {id: 'd5', name: "Face pull", reps: "3x15", time: "1m30"},
            {id: 'd6', name: "Tríceps francês polia", reps: "3x12", time: "1m30"},
            {id: 'd7', name: "Rosca martelo", reps: "3x12", time: "1m30"}
        ]},
        treinoE: { title: "Perna Posterior", exercises: [
            {id: 'e1', name: "Levantamento terra", reps: "3x6-8", time: "Nec."},
            {id: 'e2', name: "Mesa flexora", reps: "4x12", time: "1m30"},
            {id: 'e3', name: "Elevação pélvica", reps: "3x12", time: "Nec."},
            {id: 'e4', name: "Cadeira abdutora", reps: "3x13", time: "1m"},
            {id: 'e5', name: "Afundo halteres", reps: "3x12", time: "1m"}
        ]}
    };

    let workoutData = {};

    function init() {
        const theme = localStorage.getItem('app_theme') || 'dark';
        document.body.setAttribute('data-theme', theme);
        const saved = localStorage.getItem('app_workout_data');
        workoutData = saved ? JSON.parse(saved) : defaultWorkouts;
        checkAutoReset();
        renderAll();
    }

    function renderAll() {
        const container = document.getElementById('main-container');
        const activeTab = document.querySelector('.tab-btn.active').innerText.replace('Treino ', '');
        const key = 'treino' + activeTab;
        const exercises = workoutData[key].exercises;
        
        document.getElementById('workout-title').innerText = workoutData[key].title;
        
        let html = '';
        if (exercises.length === 0) {
            html = `<div class="empty-state"><p>Nenhum exercício neste treino.</p></div>`;
        } else {
            exercises.forEach(ex => {
                const isChecked = localStorage.getItem('check_'+ex.id) === 'true';
                const weight = localStorage.getItem('weight_'+ex.id) || '';
                html += `
                <div class="exercise-card ${isChecked ? 'completed' : ''}" id="card_${ex.id}">
                    <button class="btn-remove" onclick="removeEx('${key}', '${ex.id}')">✕</button>
                    <label class="custom-checkbox">
                        <input type="checkbox" onchange="toggleCheck('${ex.id}', this)" ${isChecked ? 'checked' : ''}>
                        <span class="checkmark"></span>
                    </label>
                    <div style="flex-grow:1">
                        <div style="font-weight:800; margin-bottom:10px">${ex.name}</div>
                        <div style="display:flex; justify-content: space-between; align-items: flex-end;">
                            <div><small style="color:var(--text-dim); font-size:0.6rem; text-transform:uppercase; font-weight:800">Séries</small><br><b>${ex.reps}</b></div>
                            <div><small style="color:var(--text-dim); font-size:0.6rem; text-transform:uppercase; font-weight:800">Carga</small><br>
                                <input type="text" class="weight-input" value="${weight}" onchange="saveWeight('${ex.id}', this.value)" placeholder="0kg">
                            </div>
                            <div style="text-align:right"><small style="color:var(--text-dim); font-size:0.6rem; text-transform:uppercase; font-weight:800">Pausa</small><br>
                                <span style="color:var(--accent); cursor:pointer; font-weight:700" onclick="startTimer('${ex.time}')">${ex.time}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }
        container.innerHTML = html;
        updateProgressBar();
    }

    // [LÓGICA AUXILIAR REUTILIZADA DA VERSÃO MOBILE]
    function toggleCheck(id, el) {
        localStorage.setItem('check_'+id, el.checked);
        if(el.checked) localStorage.setItem('app_last_active', Date.now());
        document.getElementById('card_'+id).classList.toggle('completed', el.checked);
        updateProgressBar();
    }

    function updateProgressBar() {
        const activeTab = document.querySelector('.tab-btn.active').innerText.replace('Treino ', '');
        const exes = workoutData['treino' + activeTab].exercises;
        const checked = exes.filter(ex => localStorage.getItem('check_'+ex.id) === 'true').length;
        const percent = exes.length > 0 ? Math.round((checked / exes.length) * 100) : 0;
        document.getElementById('summary-text').innerText = `${checked} de ${exes.length} concluídos (${percent}%)`;
        document.getElementById('summary-bar-fill').style.width = percent + '%';
    }

    function showWorkout(tab, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderAll();
    }

    function toggleTheme() {
        const current = document.body.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', next);
        localStorage.setItem('app_theme', next);
    }

    function fabEdit() { 
        document.body.classList.toggle('edit-mode');
        document.getElementById('edit-btn').innerText = document.body.classList.contains('edit-mode') ? "✅ Pronto" : "⚙️ Editar";
    }

    function fabAdd() {
        const activeTab = document.querySelector('.tab-btn.active').innerText.replace('Treino ', '');
        const name = prompt("Nome do exercício:");
        if(name) {
            workoutData['treino' + activeTab].exercises.push({
                id: 'custom_' + Date.now(),
                name: name,
                reps: prompt("Séries/Reps:", "3x12"),
                time: prompt("Pausa:", "1m30")
            });
            saveData();
        }
    }

    function fabReset() {
        const activeTab = document.querySelector('.tab-btn.active').innerText.replace('Treino ', '');
        if(confirm("Limpar progresso de hoje?")) {
            workoutData['treino' + activeTab].exercises.forEach(ex => localStorage.setItem('check_'+ex.id, 'false'));
            renderAll();
        }
    }

    function removeEx(key, id) {
        workoutData[key].exercises = workoutData[key].exercises.filter(ex => ex.id !== id);
        saveData();
    }

    function checkAutoReset() {
        const lastActive = localStorage.getItem('app_last_active');
        if (lastActive && (Date.now() - parseInt(lastActive)) > (12 * 60 * 60 * 1000)) {
            Object.keys(workoutData).forEach(k => {
                workoutData[k].exercises.forEach(ex => localStorage.setItem('check_'+ex.id, 'false'));
            });
            localStorage.removeItem('app_last_active');
        }
    }

    function saveWeight(id, val) { localStorage.setItem('weight_'+id, val); }
    function saveData() { localStorage.setItem('app_workout_data', JSON.stringify(workoutData)); renderAll(); }

    function exportData() {
        const weights = {};
        for(let i=0; i<localStorage.length; i++){
            let key = localStorage.key(i);
            if(key.startsWith('weight_')) weights[key] = localStorage.getItem(key);
        }
        const fullBackup = { workoutData: workoutData, weights: weights, theme: localStorage.getItem('app_theme') };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullBackup));
        const a = document.createElement('a');
        a.href = dataStr; a.download = "backup_desktop.json"; a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const imported = JSON.parse(e.target.result);
            if(imported.weights) Object.keys(imported.weights).forEach(k => localStorage.setItem(k, imported.weights[k]));
            if(imported.workoutData) { workoutData = imported.workoutData; saveData(); }
            location.reload();
        };
        reader.readAsText(file);
    }

    let timer;
    function startTimer(t) {
        if(t === 'Nec.') return;
        stopTimer();
        let sec = t.includes('m') ? parseInt(t.split('m')[0])*60 + (parseInt(t.split('m')[1])||0) : parseInt(t);
        const widget = document.getElementById('timer-widget');
        widget.style.display = 'flex';
        timer = setInterval(() => {
            sec--; widget.innerText = sec;
            if(sec <= 0) { clearInterval(timer); widget.style.background = 'var(--success)'; setTimeout(stopTimer, 2000); }
        }, 1000);
    }
    function stopTimer() { clearInterval(timer); document.getElementById('timer-widget').style.display = 'none'; document.getElementById('timer-widget').style.background = 'var(--accent)'; }
</script>
</body>
</html>
